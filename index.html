<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoreo SMT · Panel Móvil</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, sans-serif; background: #f1f5f9; color: #0f172a; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  </style>
</head>
<body class="min-h-screen pb-24 md:pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-sky-500 flex items-center justify-center font-extrabold text-sm shadow-inner shrink-0">SMT</div>
        <div class="truncate">
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold tracking-tight truncate">Monitoreo SMT</h1>
            <span id="syncBadge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              En vivo
            </span>
          </div>
          <p class="text-[11px] text-slate-400 truncate">Municipalidad de San Miguel de Tucumán</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="btnSync" type="button" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700 flex items-center gap-1">
          <span>🔄 Actualizar</span>
        </button>
        <a href="https://docs.google.com/spreadsheets/d/1e9bv4pk9iKfgvqpxbaf_h2GjHnfSmsTaME_j4wM_tEA/edit" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold flex items-center gap-1 shadow-sm">
          <span>Planilla</span> ↗
        </a>
      </div>
    </div>
    <div class="hidden md:block bg-slate-800/80 border-t border-slate-800">
      <div class="max-w-4xl mx-auto px-4 flex items-center gap-2 py-1.5">
        <button type="button" data-tab="feed" class="nav-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-600 text-white">📰 Noticias</button>
        <button type="button" data-tab="dashboard" class="nav-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-700/60">📊 Gráficos</button>
        <button type="button" data-tab="barrios" class="nav-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-700/60">📍 Barrios</button>
        <button type="button" data-tab="saved" class="nav-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-700/60">⭐ Guardados (<span id="savedCountDesktop">0</span>)</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-3 sm:px-4 pt-3 space-y-3.5">

    <!-- KPI Strip -->
    <section class="grid grid-cols-4 gap-2">
      <div class="bg-white rounded-2xl p-2.5 shadow-sm border border-slate-200/80">
        <p class="text-[10px] font-semibold text-slate-500 uppercase">Total</p>
        <p id="kpiTotal" class="text-xl font-extrabold text-slate-900">0</p>
        <p class="text-[10px] text-slate-400 truncate">Relevadas</p>
      </div>
      <div class="bg-white rounded-2xl p-2.5 shadow-sm border border-emerald-200/80">
        <p class="text-[10px] font-semibold text-emerald-700 uppercase">Positivas</p>
        <p id="kpiPosPct" class="text-xl font-extrabold text-emerald-600">0%</p>
        <p id="kpiPosCount" class="text-[10px] text-emerald-600/80 truncate">0 notas</p>
      </div>
      <div class="bg-white rounded-2xl p-2.5 shadow-sm border border-amber-200/80">
        <p class="text-[10px] font-semibold text-amber-700 uppercase">Neutrales</p>
        <p id="kpiNeuPct" class="text-xl font-extrabold text-amber-600">0%</p>
        <p id="kpiNeuCount" class="text-[10px] text-amber-600/80 truncate">0 notas</p>
      </div>
      <div class="bg-white rounded-2xl p-2.5 shadow-sm border border-rose-200/80">
        <p class="text-[10px] font-semibold text-rose-700 uppercase">Críticas</p>
        <p id="kpiNegPct" class="text-xl font-extrabold text-rose-600">0%</p>
        <p id="kpiNegCount" class="text-[10px] text-rose-600/80 truncate">0 notas</p>
      </div>
    </section>

    <!-- High Alert Banner -->
    <section id="highAlertBanner" class="bg-gradient-to-r from-rose-600 to-rose-700 rounded-2xl p-3 text-white shadow-sm flex items-center justify-between gap-2.5">
      <div class="flex items-start gap-2 min-w-0">
        <span class="text-base shrink-0">🚨</span>
        <div class="min-w-0">
          <p class="text-[10px] font-extrabold uppercase tracking-wider text-rose-200">Foco de Alerta Alta</p>
          <p id="highAlertTitle" class="text-xs sm:text-sm font-bold truncate">El Municipio analiza mult
